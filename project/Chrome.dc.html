<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;pointer-events:none;font-family:'Geist',system-ui,sans-serif;color:var(--ink);font-size:13px;letter-spacing:-0.005em;">

<div style="position:absolute;left:16px;right:16px;top:16px;height:52px;display:flex;align-items:center;gap:14px;padding:0 8px 0 12px;background:var(--gl);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--gb);border-radius:14px;box-shadow:var(--sh);pointer-events:auto;box-sizing:border-box;">
  <div style="display:flex;align-items:center;gap:10px;flex:none;">
    <div style="width:28px;height:28px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="var(--bg)" stroke-width="1.4"></circle><path d="M12 4.5V19.5M12 12L17 7.5M12 15L7.5 11" stroke="var(--bg)" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>
    </div>
    <div style="font-family:'Newsreader',serif;font-size:19px;font-weight:450;letter-spacing:-0.01em;">Gartenwerk</div>
  </div>
  <div style="width:1px;height:20px;background:var(--line);flex:none;"></div>
  <div style="display:flex;align-items:center;gap:8px;flex:none;">
    <span style="font-weight:500;">{{ title }}</span>
    <svg width="12" height="12" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="var(--ink3)" stroke-width="2" fill="none" stroke-linecap="round"></path></svg>
    <span style="display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px;"><span style="width:6px;height:6px;border-radius:3px;background:#5E9E6E;"></span>Gespeichert</span>
  </div>
  <div style="flex:1;"></div>
  <div style="display:flex;gap:2px;padding:3px;background:var(--fld);border-radius:10px;flex:none;">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
      <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><div style="padding:6px 12px;border-radius:7px;background:var(--tab);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line);font-weight:500;font-size:12.5px;">{{ t.n }}</div></sc-if>
      <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><div style="padding:6px 12px;border-radius:7px;color:var(--ink2);font-size:12.5px;cursor:pointer;" style-hover="color:var(--ink);background:var(--hov);">{{ t.n }}</div></sc-if>
    </sc-for>
  </div>
  <div style="flex:1;"></div>
  <div style="display:flex;align-items:center;gap:8px;flex:none;">
    <div style="display:flex;">
      <div style="width:26px;height:26px;border-radius:13px;background:#C9A27E;border:2px solid var(--tab);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#3B2A1C;">JK</div>
      <div style="width:26px;height:26px;border-radius:13px;background:#9FB39A;border:2px solid var(--tab);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#22301F;">MS</div>
    </div>
    <div style="padding:7px 12px;border-radius:9px;color:var(--ink);font-weight:500;font-size:12.5px;cursor:pointer;" style-hover="background:var(--hov);">Teilen</div>
    <div style="padding:7px 14px;border-radius:9px;background:var(--acc);color:#fff;font-weight:500;font-size:12.5px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 8px rgba(61,91,217,.35);" style-hover="filter:brightness(1.08);">Exportieren</div>
  </div>
</div>

<div style="position:absolute;left:16px;top:84px;width:48px;padding:6px;display:flex;flex-direction:column;gap:2px;background:var(--gl);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--gb);border-radius:14px;box-shadow:var(--sh);pointer-events:auto;box-sizing:border-box;">
  <sc-for list="{{ tools }}" as="t" hint-placeholder-count="9">
    <sc-if value="{{ t.sep }}" hint-placeholder-val="{{ false }}"><div style="height:1px;background:var(--line);margin:5px 4px;"></div></sc-if>
    <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><div style="position:relative;width:36px;height:36px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(61,91,217,.35);"><svg width="19" height="19" viewBox="0 0 24 24"><path d="{{ t.d }}" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></sc-if>
    <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><div style="width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:var(--hov);"><svg width="19" height="19" viewBox="0 0 24 24"><path d="{{ t.d }}" stroke="var(--ink2)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></sc-if>
  </sc-for>
</div>
<sc-if value="{{ hasTip }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;left:72px;top:{{ tipTop }};display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;background:var(--ink);color:var(--bg);border-radius:8px;font-size:12px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:nowrap;">{{ tip }}<span style="font-family:'Geist Mono',monospace;font-size:10.5px;padding:1px 5px;border-radius:4px;background:rgba(127,127,127,.3);">{{ tipKey }}</span></div>
</sc-if>

<sc-if value="{{ showLayers }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:72px;top:84px;width:236px;padding:12px 8px 8px;background:var(--gl);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--gb);border-radius:14px;box-shadow:var(--sh);pointer-events:auto;box-sizing:border-box;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px 10px;">
    <span style="font-family:'Newsreader',serif;font-size:16px;">Ebenen</span>
    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="var(--ink3)" stroke-width="1.6" stroke-linecap="round"></path></svg>
  </div>
  <div style="display:flex;flex-direction:column;gap:1px;">
    <sc-for list="{{ layers }}" as="l" hint-placeholder-count="8">
      <sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;background:var(--accs);">
          <span style="width:10px;height:10px;border-radius:3px;background:{{ l.c }};box-shadow:0 0 0 1px rgba(0,0,0,.12) inset;flex:none;"></span>
          <span style="flex:1;font-weight:500;color:var(--ink);">{{ l.n }}</span>
          <span style="font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--ink3);">{{ l.cnt }}</span>
          <svg width="15" height="15" viewBox="0 0 24 24" style="opacity:{{ l.eo }};"><path d="{{ l.eye }}" stroke="var(--ink2)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
      </sc-if>
      <sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;" style-hover="background:var(--hov);">
          <span style="width:10px;height:10px;border-radius:3px;background:{{ l.c }};box-shadow:0 0 0 1px rgba(0,0,0,.12) inset;flex:none;opacity:{{ l.eo }};"></span>
          <span style="flex:1;color:var(--ink2);opacity:{{ l.eo }};">{{ l.n }}</span>
          <span style="font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--ink3);">{{ l.cnt }}</span>
          <svg width="15" height="15" viewBox="0 0 24 24" style="opacity:{{ l.eo }};"><path d="{{ l.eye }}" stroke="var(--ink2)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
      </sc-if>
    </sc-for>
  </div>
</div>
</sc-if>

<div style="position:absolute;left:50%;bottom:16px;transform:translateX(-50%);height:48px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--gl);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--gb);border-radius:14px;box-shadow:var(--sh);pointer-events:auto;box-sizing:border-box;white-space:nowrap;">
  <div style="display:flex;align-items:center;gap:2px;">
    <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--hov);"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12h14" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round"></path></svg></div>
    <div style="min-width:48px;text-align:center;font-family:'Geist Mono',monospace;font-size:12px;">{{ zoom }}</div>
    <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--hov);"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round"></path></svg></div>
  </div>
  <div style="width:1px;height:22px;background:var(--line);"></div>
  <div style="display:flex;align-items:center;gap:10px;padding:0 8px;">
    <div style="display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--fld);font-family:'Geist Mono',monospace;font-size:12px;">{{ scale }}<svg width="10" height="10" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="var(--ink3)" stroke-width="2.4" fill="none"></path></svg></div>
    <div style="display:flex;flex-direction:column;gap:3px;">
      <div style="display:flex;height:4px;width:96px;border:1px solid var(--ink2);box-sizing:border-box;"><div style="flex:1;background:var(--ink2);"></div><div style="flex:1;"></div><div style="flex:3;background:var(--ink2);"></div></div>
      <div style="display:flex;justify-content:space-between;width:100px;font-family:'Geist Mono',monospace;font-size:9px;color:var(--ink3);line-height:1;"><span>0</span><span>1</span><span>2</span><span style="margin-left:auto;">5 m</span></div>
    </div>
  </div>
  <div style="width:1px;height:22px;background:var(--line);"></div>
  <div style="display:flex;align-items:center;gap:2px;">
    <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accs);"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M9 4v16M15 4v16" stroke="var(--acc)" stroke-width="1.5" stroke-linecap="round"></path></svg></div>
    <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accs);"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0 0 12 0V4M6 8h4M14 8h4" stroke="var(--acc)" stroke-width="1.5" stroke-linecap="round" fill="none"></path></svg></div>
  </div>
  <div style="width:1px;height:22px;background:var(--line);"></div>
  <div style="display:flex;align-items:center;gap:2px;">
    <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--hov);"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" stroke="var(--ink2)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--hov);"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3" stroke="var(--ink3)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
  </div>
  <div style="width:1px;height:22px;background:var(--line);"></div>
  <div style="display:flex;padding:3px;gap:2px;border-radius:10px;background:var(--fld);">
    <sc-if value="{{ day }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;background:var(--tab);box-shadow:0 1px 2px rgba(0,0,0,.1);font-size:12px;font-weight:500;"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#E2A33B"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="#E2A33B" stroke-width="1.6" stroke-linecap="round"></path></svg>Tag</div>
      <div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font-size:12px;color:var(--ink2);"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" stroke="var(--ink2)" stroke-width="1.6" fill="none"></path></svg>Nacht</div>
    </sc-if>
    <sc-if value="{{ night }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font-size:12px;color:var(--ink2);"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round"></path></svg>Tag</div>
      <div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;background:var(--tab);box-shadow:0 1px 2px rgba(0,0,0,.3);font-size:12px;font-weight:500;"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" fill="#C9D4FF"></path></svg>Nacht</div>
    </sc-if>
  </div>
  <div style="width:30px;height:30px;margin-left:2px;border-radius:15px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3l3 9h-6Z" fill="#C4553A"></path><path d="M12 21l-3-9h6Z" fill="var(--ink3)"></path></svg></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Planen&quot;,&quot;Sonne&quot;,&quot;Wachstum&quot;,&quot;Jahreszeiten&quot;,&quot;Bewässerung&quot;,&quot;Kosten&quot;],&quot;default&quot;:&quot;Planen&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tool&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;select&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;night&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;left&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;layers&quot;,&quot;none&quot;],&quot;default&quot;:&quot;layers&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layerActive&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;paths&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hidden&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;libOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;zoom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;84 %&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1 : 100&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Garten Lindenweg 12&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static TOOLS = [
    ['select', 'Auswahl', 'V', 'M6 3.5l12 7-5.3 1.5-2.6 5.2Z'],
    ['rect', 'Rechteck', 'R', 'M4.5 6.5h15v11h-15Z'],
    ['poly', 'Polygon', 'P', 'M5 18.5L3.5 9.5 11 4.5l9 3.5-2 10.5Z'],
    ['bezier', 'Kurve / Bézier', 'B', 'M4 18C7 9 17 14 20 6M2.8 16.8h2.4v2.4H2.8ZM18.8 4.8h2.4v2.4h-2.4ZM11 9.5L16 4.5'],
    ['free', 'Freihand', 'F', 'M3 15c2-4 4-4 5 0s3 4 5 0 4-6 8-3'],
    ['path', 'Weg-Werkzeug', 'W', 'M4 20C6 12 11 11 13 4M10 20C12 14 17 13 19.5 5'],
    ['dim', 'Bemaßung', 'M', 'M3 12h18M3 8.5v7M21 8.5v7M6.5 10.5L5 12l1.5 1.5M17.5 10.5L19 12l-1.5 1.5'],
    ['text', 'Text', 'T', 'M5.5 6.5V4.5h13v2M12 4.5v15M9.5 19.5h5'],
    ['plant', 'Pflanze setzen', 'G', 'M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17ZM12 8.5v7M8.5 12h7'],
    ['sep'],
    ['lib', 'Bibliothek', 'L', 'M4 4h7v7H4ZM13 4h7v7h-7ZM4 13h7v7H4ZM16.5 13a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7Z'],
    ['layers', 'Ebenen', 'E', 'M12 3.5l8.5 4.5-8.5 4.5L3.5 8ZM3.5 12.5l8.5 4.5 8.5-4.5M3.5 16.5l8.5 4.5 8.5-4.5']
  ];
  static LAYERS = [['plot','Grundstück','#2D3033','1'],['areas','Flächen','#9BAE74','9'],['paths','Wege','#D3CAB8','2'],['plants','Pflanzen','#6D8656','64'],['build','Gebäude & Möbel','#8A745E','21'],['light','Beleuchtung','#E9B45E','17'],['water','Bewässerung','#2F76B8','9'],['pipes','Leitungen','#B9724F','3']];
  renderVals() {
    const p = this.props;
    const tab = p.tab ?? 'Planen', tool = p.tool ?? 'select';
    const tabs = ['Planen', 'Sonne', 'Wachstum', 'Jahreszeiten', 'Bewässerung', 'Kosten'].map(n => ({ n, on: n === tab, off: n !== tab }));
    let idx = 0, tipTop = 0, tipT = '', tipK = '';
    const tools = Component.TOOLS.map(t => {
      if (t[0] === 'sep') { idx += 0.3; return { sep: true, on: false, off: false, d: '' }; }
      const on = t[0] === tool || (t[0] === 'lib' && p.libOpen) || (t[0] === 'layers' && p.layersBtn);
      if (t[0] === tool) { tipTop = 84 + 6 + idx * 38 + 7; tipT = t[1]; tipK = t[2]; }
      idx++;
      return { sep: false, on, off: !on, d: t[3] };
    });
    const hidden = (p.hidden ?? '').split(',');
    const active = p.layerActive ?? 'paths';
    const EYE = 'M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6ZM12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5Z';
    const EYEOFF = 'M4 4l16 16M10.5 6.2c.5-.1 1-.2 1.5-.2 6 0 9.5 6 9.5 6a16 16 0 0 1-2.4 3.1M6.5 7.3C4 9 2.5 12 2.5 12s3.5 6 9.5 6c1.5 0 2.9-.4 4-1';
    const layers = Component.LAYERS.map(([k, n, c, cnt]) => { const vis = !hidden.includes(k); return { n, c, cnt, on: k === active, off: k !== active, eye: vis ? EYE : EYEOFF, eo: vis ? 1 : 0.45 }; });
    const night = !!p.night;
    return {
      title: p.title ?? 'Garten Lindenweg 12', tabs, tools, layers,
      showLayers: (p.left ?? 'layers') === 'layers',
      hasTip: !!p.tip, tip: p.tip ?? '', tipKey: tipK, tipTop: tipTop + 'px',
      zoom: p.zoom ?? '84 %', scale: p.scale ?? '1 : 100', day: !night, night
    };
  }
}
</script>
</body>
</html>
