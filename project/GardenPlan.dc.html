      return { x, y, fx, fy, d: `M${x} ${y}L${sx} ${sy}A${r} ${r} 0 ${large} 1 ${ex} ${ey}Z`, rays };
    });
    const drips = BEDS.map(([x, y]) => ({ p: `M812 ${y + 8}L${x + 4} ${y + 8}L${x + 56} ${y + 8}L${x + 56} ${y + 16}L${x + 4} ${y + 16}` }));

    const LB = [
      ['Terrasse', 270, 300, 13, '70,0 m²'], ['Rasen', 395, 222, 15, '214 m²'], ['Winterlinde', 540, f(Math.min(trees[0].y + trees[0].r + 16, 330)), 13, 'Tilia cordata · 16 m'],
      ['Kiesweg', 470, 432, 12, 'b = 1,20 m'], ['Teich', 682, 474, 13, '9,4 m²'], ['Holzdeck', 597, 534, 11, ''], ['Hochbeete', 890, 448, 12, '6 × 3,6 m²'],
      ['Gewächshaus', 920, 530, 11, ''], ['Staudenbeet', 345, 492, 12, '24 m²'], ['Zugang', 120, 30, 12, 'Kies'], ['Kompost', 967, 102, 10, ''], ['Apfel', 770, f(95 + trees[1].r + 13), 11, '']
    ];
    const labelList = LB.map(([t, x, y, s, sub]) => ({ t, x, y, s, sub, y2: y + 10 }));

    return {
      vb: p.vb ?? '-50 -50 1100 700',
      lawn: S.lawn, hedge: S.hedge, shrubC: S.shrub, frost: S.frost,
      trees, treeSh, groundDots, shrubs, shrubSh,
      hedgeD, hedgeW: f(w), hedgeBump: f(w * 1.16), hedgeHi: f(w * 0.42), hedgeDash: `0 ${f(w * 0.62)}`, hedgeOff: f(-w * 0.12), hedgeSh,
      beds, veg, peren, furniture, hulls, furnTf: `translate(${f(sv[0] * 0.7)} ${f(sv[1] * 0.7)})`, shO,
      pathD, heat: !!p.heat, heatSrc: p.heat ? this.heat(doy, trees, w) : '',
      irrigation: !!p.irrigation, rings: !!p.rings, sprinklers, drips,
      grid: !!p.grid, dims: !!p.dims, labels: p.labels ?? true, ghost: !!p.ghost,
      night, day: !night, dayLamps: !night && (p.showLamps ?? true),
      maskId: uid + 'm', maskUrl: `url(#${uid}m)`, glows, cones, cores, bulbs, reflections, zig: zigP.map(q => q.join(',')).join(' '),
      lampsDay, spotsDay, selColor, selGlowId, selConeId,
      selPath: p.selected === 'path', nodes, cps, handles, callout,
      selLamp: p.selected === 'lamp', sel,
      lindenTf: `translate(540 ${f(Math.min(trees[0].y + trees[0].r + 16, 330))})`, appleTf: `translate(770 ${f(95 + trees[1].r + 13)})`,
      angText: React.createElement('text', { x: sel.tx, y: sel.ty, fontFamily: 'Geist Mono, monospace', fontSize: 9, fill: '#0B1220', textAnchor: 'middle' }, sel.ang),
      labelList, labelFill: night ? '#B4C0CC' : '#353834', labelSub: night ? '#7D8B99' : '#6E716B', labelHalo: night ? 'rgba(10,18,32,.85)' : 'rgba(238,233,222,.85)',
      boundC: night ? '#8794A3' : '#2D3033', dimC: night ? '#8794A3' : '#4A4D4F', dimHalo: night ? '#0E1724' : '#E8E4DA',
      corners: [[0,0],[1000,0],[1000,600],[0,600]].map(([x, y]) => ({ x, y, f: night ? '#0E1724' : '#F4F1EA' }))
    };
